<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d7a3b">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sideline Subs</title>
<style>
/* Layout: one thumb-friendly column. Clock and the sub card sit on top, field and bench grids below. */
:root{
  --bg:#edf1e9; --surface:#ffffff; --surface-2:#e3e9dd; --ink:#13200f; --ink-2:#4b5b45; --line:#cdd6c7;
  --pitch:#1d7a3b; --pitch-ink:#ffffff; --alert:#d9480f; --alert-bg:#fff0e6; --warn-bg:#fff6d6; --warn:#a86b00;
  --bench:#2f6f9f; --focus:#0b57d0; --grass:#3b9a5a; --grass-2:#358f53; --chalk:rgba(255,255,255,.75); --hi:#e8590c; --lo:#2f6f9f; --red:#d92d20; --green:#168a3f;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1510; --surface:#16211a; --surface-2:#223027; --ink:#e7efe4; --ink-2:#a3b4a0; --line:#2c3d31;
    --pitch:#3fb862; --pitch-ink:#07140b; --alert:#ff8a50; --alert-bg:#3a2012; --warn-bg:#35300f; --warn:#f2c14e;
    --bench:#6fb1e0; --focus:#8ab4f8; --grass:#1f5f3a; --grass-2:#1b5634; --chalk:rgba(255,255,255,.5); --hi:#ff8a50; --lo:#6fb1e0; --red:#ff6b5e; --green:#4cd07a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1510; --surface:#16211a; --surface-2:#223027; --ink:#e7efe4; --ink-2:#a3b4a0; --line:#2c3d31;
  --pitch:#3fb862; --pitch-ink:#07140b; --alert:#ff8a50; --alert-bg:#3a2012; --warn-bg:#35300f; --warn:#f2c14e;
  --bench:#6fb1e0; --focus:#8ab4f8; --grass:#1f5f3a; --grass-2:#1b5634; --chalk:rgba(255,255,255,.5); --hi:#ff8a50; --lo:#6fb1e0; --red:#ff6b5e; --green:#4cd07a; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,select,input{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
h1{font-size:1.2rem;margin:0;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0;font-weight:700}
.hint{margin:0;font-size:.85rem;color:var(--ink-2)}
.warn{color:var(--warn);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);font-weight:650;padding:10px 14px;border-radius:12px;min-height:48px;touch-action:manipulation;cursor:pointer}
.btn.primary{background:var(--pitch);color:var(--pitch-ink);border-color:transparent}
.btn.big{min-height:60px;font-size:1.15rem}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.pl:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:3.4ch;text-align:center;font-variant-numeric:tabular-nums;font-size:1.1rem}
.stepper .btn{min-width:44px;padding:6px 0}
.field-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field-row label{font-weight:600}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;max-width:100%}
input[type=text]{flex:1;min-width:0}
/* roster */
.rrow{display:grid;grid-template-columns:44px 1fr auto 40px;align-items:center;gap:8px;min-height:40px;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rn{font-weight:600;overflow-wrap:anywhere}
.rt{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.9rem}
.chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--pitch-ink);touch-action:manipulation}
.chk.on{background:var(--pitch);border-color:var(--pitch)}
.x{border:0;background:transparent;color:var(--ink-2);font-size:1.1rem;width:40px;height:36px;border-radius:10px}
/* players */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;min-height:58px;min-width:0;touch-action:manipulation;cursor:pointer}
.pl .n{font-weight:700;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl .t{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.88rem}
.pl.field{border-left:6px solid var(--pitch)}
.pl.bench{border-left:6px solid var(--bench)}
.pl.isout{opacity:.5}
.pl.out{border-left:6px solid var(--alert)}
.pl.in{border-left:6px solid var(--pitch)}
.tag{font-size:.68rem;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.tag.gk{background:var(--warn-bg);color:var(--warn)}
.tag.in{background:var(--pitch);color:var(--pitch-ink)}
.tag.out{background:var(--alert);color:#fff}
.tag.x{background:var(--ink-2);color:var(--bg)}
/* clock */
.clock{align-items:stretch;gap:8px}
.clock .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--ink-2);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.clock .time{font-size:4.2rem;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:center}
.clock .of{font-size:.95rem;font-weight:600;color:var(--ink-2)}
.track{position:relative;height:10px;border-radius:6px;background:var(--surface-2);margin:6px 0}
.track i{display:block;height:100%;border-radius:6px;background:var(--pitch)}
.track b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ink-2)}
.next{text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.sub{border-width:2px;border-color:var(--warn)}
.sub.soon{background:var(--warn-bg)}
.sub.now{background:var(--alert-bg);border-color:var(--alert)}
@media (prefers-reduced-motion: no-preference){
  .sub.now{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--alert) 35%,transparent)}}
}
.gkline{font-size:1.05rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.swaplabels,.swap{display:grid;grid-template-columns:1fr 28px 1fr;gap:6px;align-items:center}
.swaplabels{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.swap .arr{text-align:center;font-weight:800;font-size:1.2rem}
.log{margin:0;padding:0;list-style:none;font-size:.88rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.log b{color:var(--ink);font-variant-numeric:tabular-nums}
/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.sum .nm{font-weight:650;overflow-wrap:anywhere}
.sum .v{font-variant-numeric:tabular-nums;font-weight:700}
.sum .bar{grid-column:1/-1;height:8px;border-radius:5px;background:var(--surface-2);margin-bottom:6px}
.sum .bar i{display:block;height:100%;border-radius:5px;background:var(--pitch)}
/* sheet + lock */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:1.05rem}
.sheet .btn{text-align:left;display:flex;justify-content:space-between;gap:10px}
.sheet .btn small{color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;touch-action:none;text-align:center}
.lock .time{font-size:5.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.lock .banner{width:100%;max-width:420px;border:2px solid var(--alert);background:var(--alert-bg);border-radius:14px;padding:12px;font-weight:700}
.hold{position:relative;overflow:hidden;min-width:220px}
.hold::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--pitch) 40%,transparent)}
.hold.holding::after{width:100%;transition:width .7s linear}
.empty{padding:6px 0;color:var(--ink-2)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 12px}
.score .sv,.final{display:flex;align-items:baseline;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}
.score .sv b{font-size:2.2rem;line-height:1}
.final b{font-size:3rem;line-height:1}
.sl{font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--ink-2)}
.score .undog{grid-column:1/-1;justify-self:center}
.msc{font-weight:800;font-variant-numeric:tabular-nums}
.dev{display:flex;flex-wrap:wrap;gap:0 6px;justify-content:center;font-size:.74rem;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--ink);max-width:100%}
.pl .dev{justify-content:flex-start}
.lscore{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.inbox{border:2px solid var(--green)}
.linkrow{display:flex;flex-direction:column;gap:6px}
.linkbox{font-size:.78rem;width:100%;color:var(--ink-2)}
summary{cursor:pointer;color:var(--ink-2);font-size:.9rem;padding:6px 0}
details input{width:100%;margin-top:6px}
.sw{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.aoff,.aon{font-weight:900;font-size:.95em}
.aoff{color:var(--red)}
.aon{color:var(--green)}
.qn{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:baseline}
.log li{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.log li>b:first-child{min-width:3.4ch;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2);font-variant-numeric:tabular-nums}
.disc .dq{color:var(--ink)}
.grow{flex:1}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stack{display:flex;flex-direction:column;gap:6px}
.stack label{font-weight:600}
.pl{position:relative}
.pl[data-load].hi::after,.disc.hi::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--hi)}
.pl[data-load].lo::after,.disc.lo::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--lo)}
.tag.sug{background:var(--pitch);color:var(--pitch-ink)}
.shead{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
/* pitch */
.pitch{position:relative;width:100%;aspect-ratio:100/104;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--grass) 0 13%,var(--grass-2) 13% 26%)}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%}
.pitch .lines *{fill:none;stroke:var(--chalk);stroke-width:2;vector-effect:non-scaling-stroke}
.pitch .lines .dot{fill:var(--chalk);stroke:none}
.disc{position:absolute;transform:translate(-50%,-50%);width:28%;min-height:54px;padding:5px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;line-height:1.15;touch-action:manipulation;cursor:pointer;min-width:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.disc .dpos{font-size:.62rem;font-weight:800;letter-spacing:.08em;color:var(--ink-2)}
.disc .dn{font-weight:800;font-size:.95rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc .dt{font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.disc .dq{font-size:.72rem;font-weight:800;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc.gk{background:var(--warn-bg);border-color:var(--warn)}
.disc.empty{background:rgba(255,255,255,.18);border-style:dashed;border-color:var(--chalk);color:#fff;box-shadow:none;justify-content:center}
.disc.empty .dpos,.disc.empty .dn,.disc.empty .dt{color:#fff}
.disc.down{border-color:var(--red);background:rgba(0,0,0,.28)}
.disc.qd{border-style:dashed;border-color:var(--alert)}
.disc:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* clock bar and queue dock stay on screen while you scroll */
.clock{position:sticky;top:6px;z-index:6;padding:10px 14px;gap:6px}
.clock .meta{align-items:center}
.clock .clrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clock .time{font-size:2.9rem;text-align:left}
.cbtns{display:flex;gap:8px}
.cbtns .btn{min-width:0;padding:6px 12px;font-size:1.05rem}
.clock.soon{border-color:var(--warn)}
.clock.now{border-color:var(--alert)}
.dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--surface);border:2px solid var(--warn);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.dock.soon{background:var(--warn-bg)}
.dock.now{background:var(--alert-bg);border-color:var(--alert)}
@media (prefers-reduced-motion: no-preference){ .dock.now{animation:pulse 1s ease-in-out infinite} }
.dhead{display:flex;flex-direction:column}
.dhead span{font-size:.8rem;color:var(--ink-2)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.qrow .qn{overflow-wrap:anywhere}
.qrow small{color:var(--ink-2);font-variant-numeric:tabular-nums}
</style>

<body>
<div class="app" id="app"></div>
<script src="share.js"></script>
<script>
'use strict';
/* ============ helpers & state ============ */
const $ = s => document.querySelector(s);
const KEY = 'sidelineSubs.v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const fmtShort = ms => fmt(ms).replace(/^0/, '');

const DEFAULT = () => ({
  roster: [],                                   // {id, name, here, tot}  tot = tournament ms played
  cfg: { halfMin: 22, onField: 7, subsPerHalf: 3, swaps: 0, warnSec: 30, formation: '2-3-1' },   // swaps 0 = auto
  setup: { lineup: [], starters: [], gks: [], edited: false },   // lineup = starters by pitch slot (slot 0 = GK); gks = goalie pool
  sound: true,
  results: [],                                  // final score of each finished game
  share: { on: false, relay: '', team: '', opp: '', seq: 0, seen: [] },   // live sharing (keys are added when you start it)
  game: null,
});
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && Array.isArray(r.roster)) {
      const d = DEFAULT(), o = Object.assign(d, r, { cfg: Object.assign(d.cfg, r.cfg), setup: Object.assign(d.setup, r.setup), share: Object.assign(d.share, r.share) });
      if (o.game) { const g = o.game; g.queue = g.queue || []; g.inbox = g.inbox || []; g.events = g.events || []; g.gkNext = g.gkNext || ''; g.alert = ''; g.formation = g.formation || '2-3-1'; delete g.pending; }
      return o;
    }
  } catch (e) {}
  return DEFAULT();
}
let S = load();
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const save = () => { persist(); sharePing(); };
const ui = { addText: '', sheet: null, locked: false, confirm: null, alertMsg: '' };

const R = id => S.roster.find(p => p.id === id);
const nm = id => (R(id) || {}).name || '?';
const ridx = id => S.roster.findIndex(p => p.id === id);

// Formations as [label, x%, y%] per slot. Slot 0 is always the goalkeeper. Attack is at the top of the pitch.
const FORMATIONS = {
  '2-3-1': [['GK', 50, 89], ['LB', 29, 67], ['RB', 71, 67], ['LM', 16, 41], ['CM', 50, 45], ['RM', 84, 41], ['ST', 50, 15]],
  '3-2-1': [['GK', 50, 89], ['LB', 16, 67], ['CD', 50, 71], ['RB', 84, 67], ['LM', 29, 42], ['RM', 71, 42], ['ST', 50, 15]],
  '2-2-2': [['GK', 50, 89], ['LB', 29, 67], ['RB', 71, 67], ['LM', 29, 42], ['RM', 71, 42], ['LS', 29, 15], ['RS', 71, 15]],
  '1-3-2': [['GK', 50, 89], ['CD', 50, 69], ['LM', 16, 43], ['CM', 50, 47], ['RM', 84, 43], ['LS', 29, 15], ['RS', 71, 15]],
};

/* ============ clock & play time ============ */
// Half clock = time in the current half. Game clock (gm) never resets, so play time survives halftime.
function clockMs(g = S.game) { return g.baseMs + (g.status === 'running' ? Date.now() - g.startedAt : 0); }
function gameMs(g = S.game) { return g.prevMs + clockMs(g); }
function gameMsAt(g, t) { return g.prevMs + g.baseMs + (g.status === 'running' ? Math.max(0, t - g.startedAt) : 0); }
function playedMs(id, g = S.game, gm = gameMs(g)) { const p = g.p[id]; return p.played + (p.onSince != null ? gm - p.onSince : 0); }
const halfMs = () => S.cfg.halfMin * 60000;
const segMs = () => halfMs() / (S.cfg.subsPerHalf + 1);
const warnMs = () => Math.min(S.cfg.warnSec * 1000, segMs() / 2);

/* ============ sub algorithm ============ */
// Fairness rule: whoever has played the least comes on, whoever has played the most goes off.
// Ties go to the kid who has waited longest on the bench / been on the field longest.
// Ranking uses minutes in THIS game only, so a kid who missed an earlier game isn't forced to play the whole next one.
// Goalies rotate through the pool in order. The changes land on evenly spaced sub windows
// (window numbers count through the game: 1..subs, halftime = subs+1, then subs+2..).
function gkWindows(poolLen, subs) {
  const W = 2 * subs + 1, out = [];
  for (let i = 1; i < poolLen; i++) out.push(Math.round(i * (W + 1) / poolLen));
  return out;
}
function nextGk(g) {
  const full = g.gkPool || [], i = full.indexOf(g.gk);
  for (let st = 1; st <= full.length; st++) {
    const id = full[(i + st + full.length) % full.length];
    if (id !== g.gk && g.p[id] && !g.p[id].out) return id;
  }
  return '';
}
// A keeper who still owes a long stint in goal counts as having "already played" part of it, so he is rested
// before his turn instead of arriving with too many minutes. Only matters when a stint is over half the fair share.
function gkReserve(g, gm) {
  const pool = g.gkPool || [], at = g.gkAt || [];
  if (pool.length < 2) return () => 0;
  const H = halfMs(), seg = H / (g.subs + 1);
  const wt = w => w <= g.subs ? w * seg : w === g.subs + 1 ? H : H + (w - g.subs - 1) * seg;
  const fl = g.field.filter(Boolean).length, T = fl * 2 * H / (fl + g.bench.filter(id => !g.p[id].out).length);
  const res = {}, cur = at.filter(w => wt(w) <= gm + 1).length;
  for (let j = cur + 1; j < pool.length; j++) {
    const len = (j < at.length ? wt(at[j]) : 2 * H) - Math.max(gm, wt(at[j - 1]));
    res[pool[j]] = Math.max(0, 2 * len - T);
  }
  return id => res[id] || 0;
}
function suggest(g, opt = {}) {
  const gm = gameMs(g), reserve = gkReserve(g, gm), pl = id => playedMs(id, g, gm) + reserve(id);
  const newGk = opt.w && (g.gkAt || []).includes(opt.w) ? nextGk(g) : '';
  const prot = new Set([newGk || g.gk].filter(Boolean));       // the keeper in goal is never taken off
  const avail = g.bench.filter(id => !g.p[id].out);

function beep(kind) {
  if (!S.sound) return; const c = audio(); if (!c) return;
  const seq = kind === 'now' ? [[880, 0], [880, .28], [1175, .56]] : kind === 'soon' ? [[660, 0], [660, .25]] : [[523, 0], [523, .35], [523, .7], [784, 1.05]];

// Returns {ok, msg}: msg says what happened so a silent failure is visible on the Alerts card.
async function notify(title, body, opt = {}) {
  if (!('Notification' in window)) return { ok: false, msg: 'This browser cannot show notifications. Vibration and sound still work.' };
  if (Notification.permission === 'denied') return { ok: false, msg: BLOCKED_HELP };
  if (Notification.permission !== 'granted') return { ok: false, msg: 'Notifications are not allowed yet. Tap “Enable notifications” and choose Allow.' };
  try {
    if (!navigator.serviceWorker) return { ok: false, msg: 'This page cannot run its background service (needs the https address). Open the installed app or the github.io address.' };
    let reg = await navigator.serviceWorker.getRegistration();
    if (!reg || !reg.active) reg = await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 3000))]);
    if (!reg) return { ok: false, msg: 'The app’s background service is not running yet. Close the app, open it again with signal, and retry.' };
    const o = { body, tag: opt.tag || 'subs', renotify: true, requireInteraction: true, vibrate: opt.vibrate || [300, 150, 300], icon: 'icon-192.png', badge: 'icon-192.png', actions: opt.actions || [] };
    await reg.showNotification(title, o);
    const n = (await reg.getNotifications({ tag: o.tag })).length;
    const at = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    return n
      ? { ok: true, msg: 'Sent to Android at ' + at + '. Pull down the notification shade on your phone to see it. If it is there but your watch stayed quiet, the watch is not receiving it from the phone.' }
      : { ok: false, msg: 'Chrome sent it at ' + at + ' but Android did not keep it. Check Android Settings → Apps → Sideline Subs (or Chrome) → Notifications, and make sure they are on and not silenced.' };

function fixStarters() {

  const seen = new Set();

function autoStarters() {

const openSheet = (title, items) => { ui.sheet = { title, items }; };

// Pick who comes off for a bench player. Most played first, keeper last.

  openSheet('Who does ' + nm(on) + ' replace?', [{ head: 'Most played first' }, ...offs.map(o => {

    ...movers.map(([id, j]) => ({ label: nm(id), sub: 'now ' + F[j][0], fn: () => moveToSlot(g, id, i) }))]);

function playerSheet(id) {
  const g = S.game, p = g.p[id], onF = g.field.includes(id), items = [];
  const evItems = [{ head: 'Goals and cards' },
    { label: '⚽ Scored a goal', fn: () => addEvent(g, 'goal', id) },
    { label: '🟨 Yellow card', fn: () => addEvent(g, 'yellow', id) },

function act(a, d) {
  const g = S.game;
  switch (a) {
    case 'here': { const r = R(d.id); r.here = !r.here; break; }
    case 'del': S.roster = S.roster.filter(r => r.id !== d.id); break;
    case 'add': addPlayers(ui.addText); ui.addText = ''; break;
    case 'sample': addPlayers(SAMPLE.join(',')); break;
    case 'cfg': {
      const k = d.k, dv = +d.d, c = S.cfg;
      if (k === 'halfMin') c.halfMin = Math.min(45, Math.max(5, c.halfMin + dv));
      if (k === 'subsPerHalf') c.subsPerHalf = Math.min(8, Math.max(1, c.subsPerHalf + dv));
      if (k === 'swaps') c.swaps = Math.min(7, Math.max(0, c.swaps + dv));
      break;
    }
    case 'gk': {
      const s = S.setup;
      s.gks = s.gks.includes(d.id) ? s.gks.filter(x => x !== d.id) : [...s.gks, d.id];
      break;
    }
    case 'setsubs': S.cfg.subsPerHalf = +d.v; break;
    case 'slot': slotSheet(+d.i); break;
    case 'bsel': benchSheet(d.id); break;
    case 'auto': S.setup.edited = false; break;
    case 'start': startGame(); return;
    case 'alerts': enableAlerts(); return;
    case 'test': audio(); testAlert(); return;
    case 'testlater': testLater(15); return;
    case 'sound': S.sound = !S.sound; audio(); break;
    case 'resettot':
      if (ui.confirm === 'resettot') { S.roster.forEach(r => { r.tot = 0; }); S.games = 0; S.results = []; ui.confirm = null; S.setup.edited = false; }
      else { ui.confirm = 'resettot'; setTimeout(() => { if (ui.confirm === 'resettot') { ui.confirm = null; render(); } }, 3500); }
      break;
    case 'back': S.game = null; releaseWake(); closeNotif('game'); break;
    case 'clock': startClock(); return;
    case 'pause': pauseClock(); return;
    case 'endhalf':
      if (ui.confirm === 'endhalf') { ui.confirm = null; endHalf(); return; }
      ui.confirm = 'endhalf'; setTimeout(() => { if (ui.confirm === 'endhalf') { ui.confirm = null; render(); } }, 3500); break;
    case 'on': goOn(+d.i); return;
    case 'onall': goOn('all'); return;
    case 'gkgo': goOn('gk'); return;
    case 'unq': g.queue.splice(+d.i, 1); cleanQueue(g); break;
    case 'clearq': g.queue = []; g.gkNext = ''; g.alert = ''; closeNotif('subs'); break;
    case 'sq': queueAdd(g, d.off, d.on, false); break;
    case 'sqall': suggestPairs(g, 3).forEach(([o, n]) => queueAdd(g, o, n, false)); break;
    case 'shstart': shareStart().then(render); return;
    case 'shstop': shareStop().then(render); return;
    case 'shnew':
      if (ui.confirm === 'shnew') { ui.confirm = null; shareNew().then(render); return; }
      ui.confirm = 'shnew'; setTimeout(() => { if (ui.confirm === 'shnew') { ui.confirm = null; render(); } }, 3500); break;
    case 'shcopy': copyShare(d.k === 'scorer' ? shareLinks().scorer : shareLinks().watch, d.k === 'scorer' ? 'Scorer' : 'Watch'); return;
    case 'shsend': shareNative(d.k); return;
    case 'sharesheet': shareSheet(); break;
    case 'inaccept': inboxAccept(+d.i); break;
    case 'inreject': g.inbox.splice(+d.i, 1); break;
    case 'player': playerSheet(d.id); break;
    case 'hole': holeSheet(+d.i); break;
    case 'ourgoal': scorerSheet(); break;
    case 'oppgoal': addEvent(g, 'opp'); break;
    case 'undogoal': { const i = g.events.map(e => e.type).reduce((a, t, j) => (t === 'goal' || t === 'opp') ? j : a, -1); if (i >= 0) g.events.splice(i, 1); break; }
    case 'formation': S.cfg.formation = d.v; break;
    case 'undo': undo(); return;
    case 'lock': ui.locked = true; break;
    case 'newgame': S.game = null; S.setup.edited = false; break;
    case 'sheet': { const it = ui.sheet.items[+d.i]; ui.sheet = null; if (it && !it.disabled) it.fn(); break; }
    case 'sheetclose': ui.sheet = null; break;
  }

}

/* ============ live sharing ============ */
// Your phone publishes an encrypted, signed snapshot whenever something watchers can see changes (about 60 messages a game).
// Watchers use watch.html. A scorer link can send score suggestions, which show up here for you to accept or reject.
const SH = { sub: null, timer: null, retry: null, busy: false, dirty: false, force: false, sig: '', lastPub: 0, err: '', conn: 'off', minGap: 4000 };
const shareOn = () => typeof Share !== 'undefined' && !!S.share && S.share.on && !!S.share.id;
const shareBase = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const shareLinks = () => ({ watch: Share.makeLink(shareBase(), S.share, S.share.relay, false), scorer: Share.makeLink(shareBase(), S.share, S.share.relay, true) });
function shareSnapshot() {
  const sh = S.share, g = S.game, snap = { v: 1, t: Date.now(), seq: 0, team: sh.team || '', opp: sh.opp || '', half: S.cfg.halfMin, game: null };
  if (!g) return snap;
  const F = slotsOf(g), name = id => (id ? nm(id) : ''), sc = scoreOf(g);
  snap.game = {
    period: g.period, status: g.status, c: clockMs(g), formation: g.formation,
    field: g.field.map(name), pos: g.field.map((_, i) => (F[i] || [''])[0]), gk: name(g.gk),
    bench: g.bench.filter(id => !g.p[id].out).map(nm), out: (g.sentOff || []).map(x => nm(x.id)),
    down: g.field.filter(x => !x).length, us: sc.us, them: sc.them,
    ev: g.events.map(e => [e.type, name(e.id), e.half, e.c]),
  };
  return snap;
}
function shareSig(snap) { const o = JSON.parse(JSON.stringify(snap)); delete o.t; delete o.seq; if (o.game) delete o.game.c; return JSON.stringify(o); }
function sharePing(force) {
  if (!shareOn()) return;
  if (force) SH.force = true;
  clearTimeout(SH.timer); SH.timer = setTimeout(shareFlush, force ? 30 : 1200);
}
async function shareFlush() {
  if (!shareOn()) return;
  if (SH.busy) { SH.dirty = true; return; }
  const snap = shareSnapshot(), sig = shareSig(snap), now = Date.now();
  const beat = snap.game && snap.game.status === 'running' && now - SH.lastPub > 4 * 60000;     // lets watchers know you are still there
  if (sig === SH.sig && !SH.force && !beat) return;
  const wait = SH.minGap - (now - SH.lastPub);                                                // at most one message every 4 seconds
  if (wait > 0 && !SH.force) { clearTimeout(SH.timer); SH.timer = setTimeout(shareFlush, wait + 50); return; }
  SH.busy = true; SH.force = false;
  try {
    S.share.seq += 1; snap.seq = S.share.seq; persist();
    let text = await Share.sealState(S.share, snap);
    if (text.length > 3800 && snap.game) { snap.game.ev = snap.game.ev.slice(-20); text = await Share.sealState(S.share, snap); }   // relay messages are limited to about 4 KB
    await Share.Relay.publish(S.share.relay, Share.topics(S.share.id).state, text);
    SH.sig = sig; SH.lastPub = Date.now(); SH.err = ''; clearTimeout(SH.retry);
  } catch (e) {
    SH.err = e && e.status === 429 ? 'limit' : 'offline';
    clearTimeout(SH.retry); SH.retry = setTimeout(() => { SH.force = true; shareFlush(); }, SH.err === 'limit' ? 90000 : 20000);
  } finally {
    SH.busy = false; if (SH.dirty) { SH.dirty = false; sharePing(); }
    shareStatusEl();
  }
}
function shareConnect() {
  shareDisconnect();
  if (!shareOn()) return;
  SH.sub = Share.Relay.subscribe(S.share.relay, Share.topics(S.share.id).inbox, 'all', t => shareInbox(t), s => { SH.conn = s; shareStatusEl(); });
}
function shareDisconnect() { if (SH.sub) SH.sub.close(); SH.sub = null; }
async function shareInbox(text) {
  const n = await Share.openNote(S.share, text);                       // only notes made with the scorer key get through
  if (!n || !n.cid || S.share.seen.includes(n.cid)) return;
  S.share.seen.push(n.cid); S.share.seen = S.share.seen.slice(-300);
  const g = S.game;
  if (!g || g.status === 'final' || (n.kind !== 'goal' && n.kind !== 'opp')) { persist(); return; }
  const lim = 3 * halfMs();
  (g.inbox = g.inbox || []).push({ cid: n.cid, kind: n.kind, who: String(n.who || '').slice(0, 40), half: n.half === 2 ? 2 : 1, c: Math.min(lim, Math.max(0, +n.c || 0)), from: String(n.from || '').slice(0, 24) });
  g.inbox = g.inbox.slice(-20);
  persist(); render();
  const it = g.inbox[g.inbox.length - 1];
  signal('soon', 'Score suggestion', (it.from ? it.from + ': ' : '') + (it.kind === 'opp' ? 'they scored' : (it.who || 'someone') + ' scored'), { tag: 'inbox' });
}
function inboxAccept(i) {
  const g = S.game, it = g && (g.inbox || [])[i]; if (!it) return;
  const id = it.kind === 'goal' && it.who ? ((S.roster.find(r => r.name === it.who && g.p[r.id]) || {}).id || '') : '';
  addEvent(g, it.kind === 'opp' ? 'opp' : 'goal', id, { half: it.half, c: it.c });
  g.inbox.splice(i, 1);
}
function inboxView(g) {
  const items = g.inbox || [];
  if (!items.length) return '';
  return `<section class="card inbox" aria-live="polite"><h2>Score suggestions</h2>${items.map((it, i) => `<div class="qrow"><span class="qn">${it.from ? '<b>' + esc(it.from) + '</b> says ' : ''}⚽ <b>${it.kind === 'opp' ? 'they' : esc(it.who || 'someone')}</b> scored <span class="muted">${evMinute(it)}</span></span><button class="btn sm primary" data-act="inaccept" data-i="${i}">Accept</button><button class="btn sm" data-act="inreject" data-i="${i}">Reject</button></div>`).join('')}<p class="hint">Only you can change the score. Accept adds it to the score and the game log.</p></section>`;
}
async function shareStart() {
  if (typeof Share === 'undefined' || !window.crypto || !crypto.subtle) { ui.shareMsg = 'Live sharing needs the secure https address of the app.'; return; }
  const sh = S.share;
  if (!sh.id) Object.assign(sh, await Share.newSession());
  if (!sh.relay) sh.relay = Share.DEFAULT_RELAY;
  ui.shareMsg = ''; sh.on = true; persist(); shareConnect(); sharePing(true);
}
async function shareClosedNote() {
  try { const sh = S.share; sh.seq += 1; await Share.Relay.publish(sh.relay, Share.topics(sh.id).state, await Share.sealState(sh, { v: 1, t: Date.now(), seq: sh.seq, closed: true, game: null })); } catch (e) {}
}
async function shareStop() { if (shareOn()) await shareClosedNote(); S.share.on = false; shareDisconnect(); SH.sig = ''; persist(); }
async function shareNew() {                                              // new links: everything about the old ones stops working
  const sh = S.share, was = shareOn();
  if (was) await shareClosedNote();
  shareDisconnect();
  Object.assign(sh, await Share.newSession(), { seq: 0, seen: [] });
  SH.sig = ''; SH.lastPub = 0; SH.err = '';
  if (was) { sh.on = true; persist(); shareConnect(); sharePing(true); } else persist();
}
function shareStatusText() {
  if (!shareOn()) return '';
  if (SH.err === 'limit') return 'The relay is limiting messages right now, so watchers may see updates late. It clears by itself.';
  if (SH.err === 'offline') return 'No connection to the relay. The app works as normal and will catch watchers up when the connection returns.';
  if (!SH.lastPub) return 'Starting…';
  return 'Sharing is on. Last update sent at ' + new Date(SH.lastPub).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }) + '.';
}
function shareStatusEl() { const el = document.getElementById('shStatus'); if (el) el.textContent = shareStatusText(); }
async function copyShare(url, what) {
  try { await navigator.clipboard.writeText(url); ui.shareMsg = what + ' link copied. Paste it into a message.'; }
  catch (e) { ui.shareMsg = 'Could not copy automatically. Press and hold the link box, select all, and copy.'; }
  render();
}
async function shareNative(kind) {
  const L = shareLinks(), url = kind === 'scorer' ? L.scorer : L.watch;
  try { if (navigator.share) { await navigator.share({ title: 'Watch our game live', text: kind === 'scorer' ? 'Scorer link:' : 'Follow the game live:', url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  copyShare(url, kind === 'scorer' ? 'Scorer' : 'Watch');
}
function shareCard() {
  if (typeof Share === 'undefined') return '';
  const sh = S.share, on = shareOn(), names = `<div class="field-row"><label for="shTeam">Your team name</label><input type="text" id="shTeam" value="${esc(sh.team || '')}" maxlength="24" placeholder="Us"></div>
    <div class="field-row"><label for="shOpp">Opponent</label><input type="text" id="shOpp" value="${esc(sh.opp || '')}" maxlength="24" placeholder="Them"></div>`;
  if (!on) return `<section class="card"><h2>Live sharing</h2>
    <p class="hint">Let parents follow the game on their own phones: score, clock, who is where, and goals and cards. They can not change anything. You can also give one trusted person a scorer link, and their goal taps reach you as suggestions that you accept.</p>
    ${names}
    <p class="hint">Updates are encrypted on your phone before they are sent through a free public relay (ntfy.sh), which only sees scrambled text. Player names are sent exactly as you typed them in the roster, so use first names or initials if you prefer.</p>
    <details><summary>Relay server</summary><input type="text" id="shRelay" value="${esc(sh.relay || Share.DEFAULT_RELAY)}" autocomplete="off" spellcheck="false"></details>
    <button class="btn primary" data-act="shstart">Start sharing</button>${ui.shareMsg ? `<p class="hint warn">${esc(ui.shareMsg)}</p>` : ''}</section>`;
  const L = shareLinks();
  const row = (label, hint, url, k, what) => `<div class="linkrow"><b>${label}</b><span class="hint">${hint}</span><input type="text" class="linkbox" readonly value="${esc(url)}" aria-label="${label}" onfocus="this.select()"><div class="row"><button class="btn sm primary" data-act="shcopy" data-k="${k}">Copy</button><button class="btn sm" data-act="shsend" data-k="${k}">Share…</button></div></div>`;
  return `<section class="card"><h2>Live sharing</h2><p class="hint" id="shStatus">${esc(shareStatusText())}</p>
    ${row('Watch link', 'For parents. Read only.', L.watch, 'watch')}
    ${row('Scorer link', 'For one trusted person. Can suggest goals; you accept each one.', L.scorer, 'scorer')}
    ${ui.shareMsg ? `<p class="hint"><b>${esc(ui.shareMsg)}</b></p>` : ''}
    ${names}
    <p class="hint">Anyone who has a link can watch, so only send it to people you trust. If a link gets out, tap Make new links and send the new ones. The old links stop working.</p>
    <div class="row"><button class="btn ghost sm" data-act="shnew">${ui.confirm === 'shnew' ? 'Tap again: old links stop working' : 'Make new links'}</button><button class="btn danger sm" data-act="shstop">Stop sharing</button></div></section>`;
}
function shareSheet() {
  if (typeof Share === 'undefined') return;
  if (!shareOn()) { openSheet('Live sharing', [{ head: 'Sharing is off. Anyone you send a link to can follow the game.' }, { label: 'Start sharing', fn: () => { shareStart().then(render); } }]); return; }
  openSheet('Live sharing', [{ head: shareStatusText() }, { label: 'Share the watch link…', fn: () => shareNative('watch') }, { label: 'Share the scorer link…', fn: () => shareNative('scorer') },
    { head: 'Stop' }, { label: 'Stop sharing', fn: () => { shareStop().then(render); } }]);
}

/* ============ boot ============ */
if ('serviceWorker' in navigator) {
  try {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'notif') { handleAction(e.data.action, e.data.t); save(); render(); }
    });
  } catch (e) {}
}
try {
  const q = new URLSearchParams(location.search);
  if (q.get('action')) { handleAction(q.get('action'), +q.get('t') || Date.now()); history.replaceState(null, '', location.pathname); }
} catch (e) {}
render(); wake(); tick();
if (shareOn()) { shareConnect(); sharePing(true); }
setInterval(() => sharePing(), 60000);
setInterval(tick, 250);
</script>
</body>
</html>
